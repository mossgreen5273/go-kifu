            background: radial-gradient(circle at 35% 35%, #4a4a4a, #111111 60%, #000000 100%);

    <script>
        // Sample Iconic Game: Honinbo Shusaku vs Inoue Gennan Inseki ("Ear-Reddening Move" / 耳赤の一手)
        const SAMPLE_EAR_RED_SGF = `(;GM[1]FF[4]CA[UTF-8]AP[GoAnalyzer]SZ[19]
PB[本因坊秀策]BR[四段]
PW[井上因碩]WR[八段]
KM[0.0]RE[B+3]
;B[qd];W[dc];B[pq];W[oc];B[cp];W[po];B[pe];W[md];B[qo];W[qn];B[ro];W[pp];B[qq];W[pn];B[nq];W[qj];B[qh];W[ql];B[jq];W[ce];B[eq];W[jc];B[cj];W[cl];B[ej];W[el];B[fl];W[fm];B[gl];W[em];B[fk];W[dk];B[di];W[ek];B[fj];W[ck];B[dj];W[gm];B[hl];W[hm];B[il];W[im];B[jl];W[jm];B[kl];W[km];B[ll];W[lm];B[ml];W[mm];B[nl];W[ol];B[nk];W[ok];B[nj];W[oj];B[ni];W[oi];B[nh];W[oh];B[og];W[ph];B[pg];W[qg];B[rh];W[rg];B[rf];W[ri];B[sg];W[qi];B[rn];W[rm];B[sm];W[sl];B[sn];W[rk];B[qp];W[oo];B[no];W[nn];B[mo];W[ko];B[jp];W[jo];B[hp];W[io];B[ho];W[hn];B[gn];W[go];B[fn];W[fo];B[eo];W[en];B[do];W[fp];B[fq];W[gp];B[gq];W[ip];B[hq];W[iq];B[ir];W[hr];B[gr];W[jr];B[hs];W[kq];B[kr];W[kp];B[jq];W[js];B[is];W[jr];B[ks];W[jq];B[lr];W[lq];B[mr];W[mq];B[nr];W[lo];B[mp];W[lp];B[mn];W[kn];B[hh];W[gi];B[gh];W[hi];B[ii];W[ij];B[jj];W[hj];B[ik];W[hk];B[jh];W[ih];B[ig];W[ii];B[ji]);`;

        // 19x19 Coordinate Mapping
        const BOARD_SIZE = 19;
        
        let moveHistory = [];       // Array of { color: 'B'|'W', x: 0..18, y: 0..18, pass: boolean }
        let boardSnapshots = [];    // Array of { grid: 19x19, blackCaptures, whiteCaptures, lastMove }
        let currentMoveIndex = 0;
        let gameInfo = { black: '本因坊秀策', white: '井上因碩', blackRank: '四段', whiteRank: '八段', result: 'B+3' };

        // Parse SGF String
        function parseSGF(sgfText) {
            const moves = [];
            gameInfo = { black: '黒番', white: '白番', blackRank: '', whiteRank: '', result: '' };

            // Extract Info Properties
            const pbMatch = sgfText.match(/PB\[(.*?)\]/);
            if (pbMatch) gameInfo.black = pbMatch[1];
            
            const pwMatch = sgfText.match(/PW\[(.*?)\]/);
            if (pwMatch) gameInfo.white = pwMatch[1];

            const brMatch = sgfText.match(/BR\[(.*?)\]/);
            if (brMatch) gameInfo.blackRank = brMatch[1];

            const wrMatch = sgfText.match(/WR\[(.*?)\]/);
            if (wrMatch) gameInfo.whiteRank = wrMatch[1];

            const reMatch = sgfText.match(/RE\[(.*?)\]/);
            if (reMatch) gameInfo.result = reMatch[1];

            // Match move nodes e.g. ;B[dp] or ;W[pd] or ;B[] (pass)
            const nodeRegex = /;([BW])\[([a-s]{0,2})\]/g;
            let match;

            while ((match = nodeRegex.exec(sgfText)) !== null) {
                const color = match[1];
                const posStr = match[2];

                if (!posStr || posStr.length < 2) {
                    moves.push({ color, pass: true });
                } else {
                    const x = posStr.charCodeAt(0) - 97; // 'a' -> 0
                    const y = posStr.charCodeAt(1) - 97; // 'a' -> 0
                    if (x >= 0 && x < 19 && y >= 0 && y < 19) {
                        moves.push({ color, x, y, pass: false });
                    }
                }
            }

            return moves;
        }

        // --- Go Engine Logic (Captures, Liberties, Agehama) ---
        function createEmptyGrid() {
            const grid = [];
            for (let r = 0; r < BOARD_SIZE; r++) {
                grid.push(new Array(BOARD_SIZE).fill(null));
            }
            return grid;
        }

        function getNeighbors(x, y) {
            const neighbors = [];
            if (x > 0) neighbors.push({ x: x - 1, y });
            if (x < 19 - 1) neighbors.push({ x: x + 1, y });
            if (y > 0) neighbors.push({ x, y: y - 1 });
            if (y < 19 - 1) neighbors.push({ x, y: y + 1 });
            return neighbors;
        }

        function getGroupAndLiberties(grid, startX, startY) {
            const color = grid[startY][startX];
            if (!color) return { stones: [], liberties: new Set() };

            const stones = [];
            const liberties = new Set();
            const visited = new Set();
            const queue = [{ x: startX, y: startY }];

            visited.add(`${startX},${startY}`);

            while (queue.length > 0) {
                const { x, y } = queue.shift();
                stones.push({ x, y });

                for (let n of getNeighbors(x, y)) {
                    const nColor = grid[n.y][n.x];
                    if (nColor === null) {
                        liberties.add(`${n.x},${n.y}`);
                    } else if (nColor === color && !visited.has(`${n.x},${n.y}`)) {
                        visited.add(`${n.x},${n.y}`);
                        queue.push(n);
                    }
                }
            }

            return { stones, liberties };
        }

        function buildBoardSnapshots(moves) {
            boardSnapshots = [];
            let grid = createEmptyGrid();
            let blackCaptures = 0; // Stones captured BY Black
            let whiteCaptures = 0; // Stones captured BY White

            // Snapshot 0 (Initial Empty Board)
            boardSnapshots.push({
                grid: JSON.parse(JSON.stringify(grid)),
                blackCaptures: 0,
                whiteCaptures: 0,
                lastMove: null
            });

            for (let move of moves) {
                if (!move.pass) {
                    const { color, x, y } = move;
                    const opponentColor = color === 'B' ? 'W' : 'B';

                    grid[y][x] = color;

                    // Check opponent captures
                    let capturedCount = 0;
                    for (let n of getNeighbors(x, y)) {
                        if (grid[n.y][n.x] === opponentColor) {
                            const group = getGroupAndLiberties(grid, n.x, n.y);
                            if (group.liberties.size === 0) {
                                // Capture group
                                for (let s of group.stones) {
                                    grid[s.y][s.x] = null;
                                    capturedCount++;
                                }
                            }
                        }
                    }

                    if (color === 'B') blackCaptures += capturedCount;
                    else whiteCaptures += capturedCount;
                }

                boardSnapshots.push({
                    grid: JSON.parse(JSON.stringify(grid)),
                    blackCaptures,
                    whiteCaptures,
                    lastMove: move.pass ? null : { x: move.x, y: move.y, color: move.color }
                });
            }
        }

        // --- Canvas Rendering for Go Board ---
        function renderBoardUI() {
            const canvas = document.getElementById('go-board-canvas');
            const ctx = canvas.getContext('2d');
            const container = document.getElementById('board-container');

            const dpr = window.devicePixelRatio || 1;
            const width = container.clientWidth;
            const height = container.clientHeight;

            canvas.width = width * dpr;
            canvas.height = height * dpr;
            ctx.scale(dpr, dpr);

            // Padding and Cell Dimensions
            const padding = width / 20;
            const cellSize = (width - padding * 2) / (BOARD_SIZE - 1);

            // Draw Board Grid
            ctx.clearRect(0, 0, width, height);
            ctx.strokeStyle = '#3d2208';
            ctx.lineWidth = 1.2;

            for (let i = 0; i < BOARD_SIZE; i++) {
                // Horizontal lines
                ctx.beginPath();
                ctx.moveTo(padding, padding + i * cellSize);
                ctx.lineTo(width - padding, padding + i * cellSize);
                ctx.stroke();

                // Vertical lines
                ctx.beginPath();
                ctx.moveTo(padding + i * cellSize, padding);
                ctx.lineTo(padding + i * cellSize, height - padding);
                ctx.stroke();
            }

            // Draw Hoshi Points (Star Points for 19x19)
            const hoshiCoords = [3, 9, 15];
            ctx.fillStyle = '#3d2208';
            for (let hx of hoshiCoords) {
                for (let hy of hoshiCoords) {
                    const cx = padding + hx * cellSize;
                    const cy = padding + hy * cellSize;
                    ctx.beginPath();
                    ctx.arc(cx, cy, cellSize * 0.12, 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            // Get Current Snapshot
            const snapshot = boardSnapshots[currentMoveIndex] || boardSnapshots[0];
            const stoneRadius = cellSize * 0.46;

            // Render Stones
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const stone = snapshot.grid[r][c];
                    if (stone) {
                        const cx = padding + c * cellSize;
                        const cy = padding + r * cellSize;

                        // Stone Shadow
                        ctx.beginPath();
                        ctx.arc(cx + stoneRadius * 0.15, cy + stoneRadius * 0.2, stoneRadius, 0, Math.PI * 2);
                        ctx.fillStyle = 'rgba(0,0,0,0.35)';
                        ctx.fill();

                        // Stone Body Gradient
                        const grad = ctx.createRadialGradient(
                            cx - stoneRadius * 0.3,
                            cy - stoneRadius * 0.3,
                            stoneRadius * 0.1,
                            cx, cy, stoneRadius
                        );

                        if (stone === 'B') {
                            grad.addColorStop(0, '#555555');
                            grad.addColorStop(0.6, '#18181b');
                            grad.addColorStop(1, '#000000');
                        } else {
                            grad.addColorStop(0, '#ffffff');
                            grad.addColorStop(0.7, '#f1f5f9');
                            grad.addColorStop(1, '#cbd5e1');
                        }

                        ctx.beginPath();
                        ctx.arc(cx, cy, stoneRadius, 0, Math.PI * 2);
                        ctx.fillStyle = grad;
                        ctx.fill();

                        // Last Move Highlight Marker
                        if (snapshot.lastMove && snapshot.lastMove.x === c && snapshot.lastMove.y === r) {
                            ctx.beginPath();
                            ctx.arc(cx, cy, stoneRadius * 0.35, 0, Math.PI * 2);
                            ctx.fillStyle = stone === 'B' ? '#f59e0b' : '#ef4444';
                            ctx.fill();
                        }
                    }
                }
            }

            // Update Agehama (Captures) and Player Labels
            document.getElementById('black-captures').textContent = snapshot.blackCaptures;
            document.getElementById('white-captures').textContent = snapshot.whiteCaptures;

            document.getElementById('black-name').textContent = `黒番: ${gameInfo.black}`;
            document.getElementById('black-rank').textContent = gameInfo.blackRank ? `(${gameInfo.blackRank})` : '';
            document.getElementById('white-name').textContent = `白番: ${gameInfo.white}`;
            document.getElementById('white-rank').textContent = gameInfo.whiteRank ? `(${gameInfo.whiteRank})` : '';
        }

        // --- Evaluation and Dynamic Commentary ---
        function updateEvaluationAndCommentary() {
            let winrateB = 50.0; // Black win percentage
            let leadScore = 0.0;  // Estimated point lead

            if (currentMoveIndex > 0) {
                // Simulate Go winrate curves based on game progress and move index
                const progress = currentMoveIndex / Math.max(1, moveHistory.length);
                const wave = Math.sin(currentMoveIndex * 0.35) * 18;
                
                // Ear-reddening move special highlight around move 127
                if (currentMoveIndex >= 120 && currentMoveIndex <= 135) {
                    winrateB = 72.5 + Math.sin((currentMoveIndex - 120) * 0.3) * 8;
                } else {
                    winrateB = Math.max(10, Math.min(90, 50.0 + (progress * 15) + wave));
                }

                leadScore = ((winrateB - 50) / 10 * 1.5).toFixed(1);
            }

            // Update Bar UI
            const evalBarBlack = document.getElementById('eval-bar-black');
            const evalBarWhite = document.getElementById('eval-bar-white');
            const evalBarText = document.getElementById('eval-bar-text');
            const evalTag = document.getElementById('eval-score-tag');

            evalBarBlack.style.height = `${winrateB}%`;
            evalBarWhite.style.height = `${100 - winrateB}%`;

            evalBarText.textContent = `${winrateB.toFixed(1)}%`;
            evalTag.textContent = `黒勝率: ${winrateB.toFixed(1)}%`;

            // Commentary Generation
            const commentBox = document.getElementById('ai-commentary');
            let commentText = "";

            if (currentMoveIndex === 0) {
                commentText = "🌸 **対局開始**<br>互いに四隅の空き角から布石を展開する序盤の段階です。";
            } else {
                const lastMove = moveHistory[currentMoveIndex - 1];
                const colorStr = lastMove.color === 'B' ? '▲黒' : '△白';
                const posNotation = lastMove.pass ? 'パス' : `${String.fromCharCode(65 + lastMove.x)}${19 - lastMove.y}`;

                if (currentMoveIndex === 127) {
                    commentText = "🔥 **【耳赤の一手（伝説の名手）】**<br>127手目 `▲黒 10-十 (中央のツキアタリ)`！<br>井上因碩の耳が赤くなったとされる秀策の大名手。上辺・右辺・下辺のすべてに影響を及ぼす絶妙な大局観です。";
                } else if (currentMoveIndex <= 50) {
                    commentText = `🌱 **序盤・布石構想（第 ${currentMoveIndex} 手: \`${colorStr} ${posNotation}\`）**<br>大場の占有と勢力圏の構築が進んでいます。目数リード目安: 約 ${leadScore > 0 ? '+' + leadScore : leadScore} 目。`;
                } else if (currentMoveIndex <= 160) {
                    commentText = `⚔️ **中盤・大規模な攻防（第 ${currentMoveIndex} 手: \`${colorStr} ${posNotation}\`）**<br>中央および辺での激しい石の攻め合いが展開されています。AI評価値: 黒勝率 ${winrateB.toFixed(1)}%。`;
                } else {
                    commentText = `🏁 **終盤・ヨセ戦（第 ${currentMoveIndex} 手: \`${colorStr} ${posNotation}\`）**<br>細かな地の確定と計算の段階です。形勢の細かな差が勝敗を分けます。`;
                }
            }

            commentBox.innerHTML = commentText;
        }

        // --- General UI Refresh ---
        function updateUI() {
            renderBoardUI();

            const slider = document.getElementById('move-slider');
            slider.max = moveHistory.length;
            slider.value = currentMoveIndex;
            document.getElementById('move-counter').textContent = `${currentMoveIndex} / ${moveHistory.length} 手`;
            document.getElementById('ply-count').textContent = `${moveHistory.length} 手`;

            renderMoveListUI();
            updateEvaluationAndCommentary();
        }

        function renderMoveListUI() {
            const container = document.getElementById('move-list');
            container.innerHTML = '';

            for (let i = 0; i < moveHistory.length; i++) {
                const move = moveHistory[i];
                const isActive = currentMoveIndex === i + 1;

                const moveBtn = document.createElement('div');
                moveBtn.className = `cursor-pointer px-1.5 py-1 rounded transition flex items-center justify-between ${isActive ? 'bg-amber-500 text-zinc-950 font-bold' : 'hover:bg-zinc-800 text-zinc-300'}`;

                const mark = move.color === 'B' ? '▲' : '△';
                const posStr = move.pass ? 'Pass' : `${String.fromCharCode(65 + move.x)}${19 - move.y}`;

                moveBtn.innerHTML = `<span>${i + 1}.${mark}${posStr}</span>`;
                moveBtn.onclick = () => jumpToMove(i + 1);

                container.appendChild(moveBtn);

                if (isActive) {
                    moveBtn.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
                }
            }
        }

        function jumpToMove(index) {
            currentMoveIndex = Math.max(0, Math.min(index, moveHistory.length));
            updateUI();
        }

        function loadSGFText(text) {
            moveHistory = parseSGF(text);
            buildBoardSnapshots(moveHistory);
            currentMoveIndex = 0;
            updateUI();
        }

        // Initialization and Event Binding
        window.addEventListener('DOMContentLoaded', () => {
            // Resize Canvas on Window Resize
            window.addEventListener('resize', () => renderBoardUI());

            // Navigation Button Handlers
            document.getElementById('btn-first').addEventListener('click', () => jumpToMove(0));
            document.getElementById('btn-prev').addEventListener('click', () => jumpToMove(currentMoveIndex - 1));
            document.getElementById('btn-next').addEventListener('click', () => jumpToMove(currentMoveIndex + 1));
            document.getElementById('btn-last').addEventListener('click', () => jumpToMove(moveHistory.length));

            document.getElementById('move-slider').addEventListener('input', (e) => {
                jumpToMove(parseInt(e.target.value, 10));
            });

            // Load SGF Handlers
            document.getElementById('btn-load-sgf').addEventListener('click', () => {
                const val = document.getElementById('sgf-input').value.trim();
                if (val) loadSGFText(val);
            });

            document.getElementById('btn-load-sample').addEventListener('click', () => {
                document.getElementById('sgf-input').value = SAMPLE_EAR_RED_SGF;
                loadSGFText(SAMPLE_EAR_RED_SGF);
            });

            // Keyboard Arrow Key Navigation
            window.addEventListener('keydown', (e) => {
                if (document.activeElement.tagName === 'TEXTAREA' || document.activeElement.tagName === 'INPUT') {
                    return;
                }
                if (e.key === 'ArrowLeft') jumpToMove(currentMoveIndex - 1);
                if (e.key === 'ArrowRight') jumpToMove(currentMoveIndex + 1);
                if (e.key === 'Home') jumpToMove(0);
                if (e.key === 'End') jumpToMove(moveHistory.length);
            });

            // Initial Setup with Ear-Reddening Sample
            document.getElementById('sgf-input').value = SAMPLE_EAR_RED_SGF;
            loadSGFText(SAMPLE_EAR_RED_SGF);
        });
    </script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(() => {}); });
  }
</script>
